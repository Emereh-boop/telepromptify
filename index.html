<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snap Prompter</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <!-- Screen Flash Overlay -->
  <div id="flashOverlay"></div>

  <!-- SETUP SCREEN -->
  <div id="setup">
    <div class="card">
      <div class="header">
        <svg class="snap-logo" viewBox="0 0 24 24"><path d="M12 2C8 2 5 4.5 5 8c0 2 1 3.5 1.5 5-.5 1-2 1.5-3 1.5s-1.5 1-1 2c1 2 4.5 2.5 6.5 2.5.5 1 1.5 3 3 3s2.5-2 3-3c2 0 5.5-.5 6.5-2.5.5-1 0-2-1-2s-2.5-.5-3-1.5c.5-1.5 1.5-3 1.5-5 0-3.5-3-6-7-6z"/></svg>
        <h1>Snap Prompter</h1>
      </div>
      <p class="sub">Paste your script or import a file. Get ready to shoot clean, readable videos with snap controls!</p>
      <p class="sub" id="secureWarning" style="display:none; color:#e0245e;"></p>
      
      <!-- Enable native context menus/pasting explicitly -->
      <textarea id="scriptInput" placeholder="Type or paste your script here..." spellcheck="true"></textarea>
      
      <div class="setup-row">
        <button id="importBtn" class="btn-snap-secondary">
          <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
          Import
        </button>
        <input type="file" id="fileInput" accept=".txt,.docx,.pdf" style="display:none;">
        <span id="importStatus"></span>
        <button id="startBtn" class="btn-snap-primary">Start</button>
      </div>
    </div>
  </div>

  <!-- REVIEW SCREEN -->
  <div id="review">
    <div class="card review-card">
      <video id="reviewVideo" controls playsinline></video>
      <div class="review-actions">
        <a id="downloadBtn" class="btn-snap-primary" download="snap-take.webm">
          <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        </a>
        <button id="retakeBtn" class="btn-snap-secondary" title="Retake">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <button id="reviewEditBtn" class="btn-snap-secondary" title="Edit Script">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- STAGE SCREEN -->
  <div id="stage">
    <video id="camera" autoplay playsinline muted></video>
    <div id="noCameraMsg">Camera / mic offline.<br>Rehearsal mode active.</div>
    <div id="dimOverlay"></div>
    <div id="guide"></div>

    <!-- Scrolling Text Viewport -->
    <div id="viewport">
      <div id="scrollWrap">
        <div id="textFlow"></div>
      </div>
    </div>

    <!-- Combined Speed Controls (Stacked on Right Side) -->
    <div class="speed-control-stack">
      <button id="speedUpBtn" class="side-btn" title="Increase Speed">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
      <button id="speedDownBtn" class="side-btn" title="Decrease Speed">
        <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
      </button>
    </div>

    <!-- Top Camera Header Overlay (Camera Flip Removed) -->
    <div id="topHeader">
      <button id="backBtn" class="circle-btn" title="Edit Script">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>

      <div id="recBadge"><span class="dot"></span><span id="recTime">0:00</span></div>

      <div class="header-actions">
        <button id="flashBtn" class="circle-btn" title="Screen Flash">
          <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
        </button>
      </div>
    </div>

    <div id="countdown"></div>
    <button id="showBarBtn" class="circle-btn">
      <svg viewBox="0 0 24 24"><path d="M12 8l-6 6h12z"/></svg>
    </button>

    <!-- Bottom Controls Panel -->
    <div id="controls">
      <div class="ctrl-row flex-center">
        <button id="restartBtn" class="icon-btn" title="Back to Top">
          <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        </button>
        <button id="mirrorBtn" class="icon-btn" title="Mirror Camera">
          <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
        </button>

        <!-- RECORD BUTTON AREA -->
        <div class="record-wrapper">
          <button id="pauseRecBtn" class="circle-btn pause-rec-btn" title="Pause/Resume Rec" style="display:none;">
            <svg id="pauseRecIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          
          <button id="recordBtn" class="snap-rec-outer" title="Record Take">
            <div class="snap-rec-inner"></div>
          </button>
        </div>

        <button id="playBtn" class="icon-btn" title="Play/Pause Rehearsal">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="fsBtn" class="icon-btn" title="Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
        <button id="hideBarBtn" class="icon-btn" title="Hide Controls">
          <svg viewBox="0 0 24 24"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
        </button>
      </div>

      <!-- Sliders Row -->
      <div class="ctrl-row sliders-row">
        <div class="ctrl-group">
          <span class="slider-icon">⚡</span>
          <input type="range" id="speedSlider" min="70" max="220" value="140">
        </div>
        <div class="ctrl-group">
          <span class="slider-icon">A</span>
          <input type="range" id="fontSlider" min="24" max="100" value="46">
        </div>
        <div class="ctrl-group">
          <span class="slider-icon">↔</span>
          <input type="range" id="marginSlider" min="0" max="30" value="10">
        </div>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
